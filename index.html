<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Seleção de Painel - Operacional</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #1f2937;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
        }
        .painel-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.2s;
        }
        .btn-painel {
            background-color: #2b3a67;
            color: white;
            width: 100%;
            border: none;
            text-align: left;
            padding: 18px 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        .btn-painel:hover {
            background-color: #1e2848;
        }
        .submenu-login {
            display: none;
            padding: 15px 20px;
            background-color: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
        .submenu-login input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .submenu-login button {
            width: 100%;
            padding: 10px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .submenu-login button:hover {
            background-color: #059669;
        }
        .painel-bloqueado {
            background-color: #94a3b8 !important;
            cursor: not-allowed !important;
        }
        .status-bloqueio {
            font-size: 12px;
            color: #d97706;
            margin-top: 5px;
            font-weight: bold;
        }
        .btn-reset-discreto {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.8;
            z-index: 9999;
        }
        .btn-reset-discreto:hover {
            opacity: 1;
            background: #cbd5e1;
        }
    </style>
</head>
<body>

    <h1>Selecione o Painel:</h1>

    <div class="menu-container">
        <!-- Check-in -->
        <div class="painel-card" id="card-checkin">
            <button class="btn-painel" onclick="toggleSubmenu('checkin')">
                Check-in <span>▼</span>
            </button>
            <div id="sub-checkin" class="submenu-login">
                <input type="text" id="login-checkin" placeholder="Digite seu login (Ex: Nome/ID)..." autocomplete="off">
                <button onclick="acessarPainel('checkin', 'Checkin-AB.html')">Entrar no Setor</button>
                <div id="aviso-checkin" class="status-bloqueio"></div>
            </div>
        </div>

        <!-- Check-in CD -->
        <div class="painel-card" id="card-checkincd">
            <button class="btn-painel" onclick="toggleSubmenu('checkincd')">
                Check-in CD <span>▼</span>
            </button>
            <div id="sub-checkincd" class="submenu-login">
                <input type="text" id="login-checkincd" placeholder="Digite seu login..." autocomplete="off">
                <button onclick="acessarPainel('checkincd', 'checkin-CD.html')">Entrar no Setor</button>
                <div id="aviso-checkincd" class="status-bloqueio"></div>
            </div>
        </div>

        <!-- P2M Sorter A/B -->
        <div class="painel-card" id="card-p2mab">
            <button class="btn-painel" onclick="toggleSubmenu('p2mab')">
                P2M Sorter A/B <span>▼</span>
            </button>
            <div id="sub-p2mab" class="submenu-login">
                <input type="text" id="login-p2mab" placeholder="Digite seu login..." autocomplete="off">
                <button onclick="acessarPainel('p2mab', 'P2M_Sorter-AB.html')">Entrar no Setor</button>
                <div id="aviso-p2mab" class="status-bloqueio"></div>
            </div>
        </div>

        <!-- P2M Sorter CD -->
        <div class="painel-card" id="card-p2mcd">
            <button class="btn-painel" onclick="toggleSubmenu('p2mcd')">
                P2M Sorter CD <span>▼</span>
            </button>
            <div id="sub-p2mcd" class="submenu-login">
                <input type="text" id="login-p2mcd" placeholder="Digite seu login..." autocomplete="off">
                <button onclick="acessarPainel('p2mcd', 'P2M_Sorter-CD.html')">Entrar no Setor</button>
                <div id="aviso-p2mcd" class="status-bloqueio"></div>
            </div>
        </div>
    </div>

    <button class="btn-reset-discreto" onclick="resetarTestes()">⚙️ Destravar Tudo</button>

    <script>
        const setores = ['checkin', 'checkincd', 'p2mab', 'p2mcd'];
        const PREFIXO = "p2m_v2_bloqueio_";

        window.onload = function() {
            setores.forEach(s => localStorage.removeItem("duplo_bloqueio_" + s));
            atualizarInterface();
        };

        function atualizarInterface() {
            setores.forEach(setor => {
                const donoSetor = localStorage.getItem(PREFIXO + setor);
                const card = document.getElementById("card-" + setor);
                const btn = card.querySelector(".btn-painel");

                if (donoSetor) {
                    btn.classList.add("painel-bloqueado");
                    document.getElementById("aviso-" + setor).innerText = "Setor em uso por outro Team Leader.";
                } else {
                    btn.classList.remove("painel-bloqueado");
                    document.getElementById("aviso-" + setor).innerText = "";
                }
            });
        }

        function toggleSubmenu(setorId) {
            const donoSetor = localStorage.getItem(PREFIXO + setorId);
            if (donoSetor) {
                alert("Este setor já está sob a responsabilidade de outro Team Leader e encontra-se bloqueado para acesso externo.");
                return;
            }

            setores.forEach(s => {
                const sub = document.getElementById("sub-" + s);
                if (s === setorId) {
                    sub.style.display = sub.style.display === "block" ? "none" : "block";
                } else {
                    sub.style.display = "none";
                }
            });
        }

        function acessarPainel(setorId, urlDestino) {
            const inputLogin = document.getElementById("login-" + setorId).value.trim();
            
            if (inputLogin === "") {
                alert("Por favor, digite seu login para prosseguir.");
                return;
            }

            localStorage.setItem(PREFIXO + setorId, inputLogin);
            window.location.href = urlDestino;
        }

        function resetarTestes() {
            setores.forEach(s => {
                localStorage.removeItem(PREFIXO + s);
                localStorage.removeItem("duplo_bloqueio_" + s);
            });
            alert("Todos os setores foram destravados com sucesso!");
            location.reload();
        }
    </script>

</body>
</html>
